[package]
name = "konsol"
version = "0.1.0"
description = "Lance tous les jeux du PC depuis une seule app"
authors = ["qyrn"]
edition = "2024"

[lib]
name = "konsol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.11.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
